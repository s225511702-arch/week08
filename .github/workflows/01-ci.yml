name: 01 - CI

on:
  # Run on every push to main - Terraform runs first, as a job below
  push:
    branches:
      - main

  # Manual trigger for the workflow
  workflow_dispatch:

permissions:
  contents: read

env:
  # NEW: the commit being built, whether triggered by workflow_run or manually
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:

  # =========================================================
  # NEW: Infrastructure - reusable Terraform workflow (00)
  # =========================================================
  infrastructure:
    name: Terraform
    uses: ./.github/workflows/00-infrastructure.yml
    secrets: inherit

  # =========================================================
  # Backend Tests
  # =========================================================
  backend-test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest

    # NEW: tests only start once Terraform has succeeded
    needs:
      - infrastructure

    strategy:
      fail-fast: false

      matrix:
        include:
          - service: user-service
            database: users
            port: 5433

          - service: student-service
            database: students
            port: 5434

          - service: lecturer-service
            database: lecturers
            port: 5435

          - service: course-service
            database: courses
            port: 5436

          - service: enrollment-service
            database: enrollments
            port: 5437

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ${{ matrix.database }}

        ports:
          - ${{ matrix.port }}:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d ${{ matrix.database }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ${{ matrix.database }}
      POSTGRES_HOST: localhost
      POSTGRES_PORT: ${{ matrix.port }}

      JWT_SECRET_KEY: koalatech-ci-test-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

      DEFAULT_ADMIN_USERNAME: admin
      DEFAULT_ADMIN_EMAIL: admin@koalatech.edu.au
      DEFAULT_ADMIN_PASSWORD: AdminPassword123!

      AZURE_STORAGE_CONNECTION_STRING: ""
      AZURE_STORAGE_CONTAINER_NAME: ""

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: |
          pytest -v


  # =========================================================
  # Build, Scan and Push Docker Images
  # =========================================================
  build-and-push:
    name: Build, Scan and Push ${{ matrix.image }}
    runs-on: ubuntu-latest

    # All backend tests must pass before this job starts
    needs:
      - backend-test

    strategy:
      fail-fast: false

      matrix:
        include:
          - service: frontend
            image: koalatech-frontend

          - service: user-service
            image: koalatech-user-service

          - service: student-service
            image: koalatech-student-service

          - service: lecturer-service
            image: koalatech-lecturer-service

          - service: course-service
            image: koalatech-course-service

          - service: enrollment-service
            image: koalatech-enrollment-service

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name ${{ vars.ACR_NAME }}

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -t ${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ env.IMAGE_TAG }} \
            ./${{ matrix.service }}

      # NEW: Docker Scout needs a Docker Hub login
      - name: Login to Docker Hub (for Docker Scout)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # NEW: full report of critical/high CVEs and base image recommendations
      - name: Docker Scout - vulnerability report and recommendations
        uses: docker/scout-action@v1
        with:
          command: cves,recommendations
          image: local://${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}
          only-severities: critical,high
          summary: true
          exit-code: false

      # NEW: security gate - fail if any FIXABLE critical/high CVE exists
      - name: Docker Scout - security gate (fixable critical/high)
        uses: docker/scout-action@v1
        with:
          command: cves
          image: local://${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}
          only-severities: critical,high
          only-fixed: true
          exit-code: true
          summary: false

      - name: Push Docker image with commit SHA
        run: |
          docker push \
            ${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}
